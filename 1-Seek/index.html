<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seek & Flee — Exercices Steering Behaviors</title>
    <link rel="stylesheet" href="style.css">
    <script src="libraries/p5.min.js"></script>
    <script src="vehicle.js"></script>
    <script src="FollowerVehicle.js"></script>
    <script src="target.js"></script>
    <script src="targetFuyante.js"></script>
    <script src="mouseTarget.js"></script>
    <script src="soundEffects.js"></script>
    <script src="population.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <header id="controls">
      <div class="control-group">
        <label for="scenario-select">Scénario :</label>
        <select id="scenario-select">
          <option value="1" selected>Scénario 1 : Suiveurs & Réapparition</option>
          <option value="2">Scénario 2 : Cible Fuyante (Flee)</option>
        </select>
      </div>

      <div class="control-group group-scenario-2" id="group-detection-radius" style="display: none;">
        <label for="detection-radius">Rayon Détection :</label>
        <input id="detection-radius" type="range" min="50" max="400" step="10" value="200">
        <output id="detection-radius-value">200 px</output>
      </div>

      <div class="control-group group-scenario-2" id="group-flee-duration" style="display: none;">
        <label for="flee-duration">Durée Fuite Max :</label>
        <input id="flee-duration" type="range" min="0.5" max="6.0" step="0.1" value="2.5">
        <output id="flee-duration-value">2.5 s</output>
      </div>

      <div class="control-group">
        <label for="vehicle-count">Véhicules :</label>
        <input id="vehicle-count" type="range" min="1" max="200" step="1" value="20">
        <output id="vehicle-count-value">20 / 200</output>
      </div>

      <div class="control-group">
        <label for="vitesse-max">Vitesse Max :</label>
        <input id="vitesse-max" type="range" min="1" max="20" step="1" value="4">
        <output id="vitesse-max-value">4</output>
      </div>

      <div class="control-group">
        <label for="force-max">Force Max :</label>
        <input id="force-max" type="range" min="0.01" max="1" step="0.01" value="0.1">
        <output id="force-max-value">0.1</output>
      </div>

      <div class="control-group">
        <button id="toggle-mode" type="button">Mode : Seek</button>
        <button id="toggle-target" type="button">Cible : Souris</button>
        <button id="toggle-variant" type="button">Arrivée : Véhicule réapparaît</button>
        <button id="toggle-sound" type="button" title="Activer ou couper le son">🔊 Son : ON</button>
        <button id="toggle-debug" type="button" title="Activer / désactiver le mode debug (touche 'd')">🛠️ Debug [D] : OFF</button>
      </div>

      <div class="control-group">
        <label for="bg-select">Fond :</label>
        <select id="bg-select">
          <option value="rainbow_wave" selected>🌈 Ondes Néon Psychédéliques (Clignotant & Mouvement)</option>
          <option value="#000000">Noir</option>
          <option value="#0b132b">Bleu nuit</option>
          <option value="#1c2541">Bleu profond</option>
          <option value="#1a1a24">Gris sombre</option>
          <option value="#0d1b1e">Vert sombre</option>
          <option value="#240046">Violet cosmique</option>
          <option value="stars">✨ Étoilé</option>
          <option value="grid">🌐 Grille Cyber</option>
          <option value="custom">🎨 Personnalisé</option>
        </select>
        <input id="bg-color-picker" type="color" value="#000000" title="Choisir une couleur personnalisée">
      </div>

      <span class="hint">Survolez le canvas ou activez la cible mobile.</span>
    </header>
    <main id="scene" aria-label="Simulation de véhicules suiveurs"></main>
  </body>
</html>
