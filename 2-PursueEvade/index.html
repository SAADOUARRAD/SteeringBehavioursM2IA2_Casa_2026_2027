<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 — Pursue & Evade Multi-Cibles avec Leurres (Flares)</title>
    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script src="vehicle.js"></script>
    <script src="Flare.js"></script>
    <script src="target.js"></script>
    <script src="bouncingBall.js"></script>
    <script src="Pursuer.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <header id="controls">
      <div class="control-group">
        <label for="pursuer-speed">Vitesse Chasseur :</label>
        <input id="pursuer-speed" type="range" min="3" max="16" step="0.5" value="8">
        <output id="pursuer-speed-value">8</output>
      </div>

      <div class="control-group">
        <label for="target-speed">Vitesse Cibles :</label>
        <input id="target-speed" type="range" min="2" max="10" step="0.5" value="3.5">
        <output id="target-speed-value">3.5</output>
      </div>

      <div class="control-group">
        <label for="detection-radius">Rayon Détection :</label>
        <input id="detection-radius" type="range" min="80" max="350" step="10" value="180">
        <output id="detection-radius-value">180 px</output>
      </div>

      <div class="control-group">
        <button id="toggle-flares" type="button">✨ Leurres (Flares) : ON</button>
        <button id="toggle-debug" type="button" title="Activable aussi avec la touche 'd'">🛠️ Debug [D] : OFF</button>
      </div>

      <span class="hint">4 cibles simultanées • Trajectoire prédictive haute précision • Clic pour téléporter le chasseur</span>
    </header>
    <main id="canvas-container"></main>
  </body>
</html>
