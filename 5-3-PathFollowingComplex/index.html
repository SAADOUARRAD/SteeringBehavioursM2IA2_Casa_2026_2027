<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5-3 Path Following Complex — Grand Prix Moto & Circuits Multi-Niveaux</title>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <!-- Librairies P5.js -->
    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>

    <!-- Code de base fourni (100% intact) -->
    <script src="path.js"></script>
    <script src="vehicle.js"></script>

    <!-- Moteur Audio & Niveaux de circuit & Entités Moto -->
    <script src="MotoAudio.js"></script>
    <script src="ObstacleAvoidance.js"></script>
    <script src="levels.js"></script>
    <script src="ExhaustParticle.js"></script>
    <script src="Moto.js"></script>
    <script src="MotoSquad.js"></script>
    <script src="TrackObstacle.js"></script>

    <!-- Sketch principal -->
    <script src="sketch.js"></script>
  </head>
  <body>
    <header id="controls">
      <!-- Sélecteur de Niveau -->
      <div class="control-group">
        <label for="select-level">🏁 Niveau :</label>
        <select id="select-level">
          <option value="0">Niv. 1 — Speedway Débutant (Daytona)</option>
          <option value="1">Niv. 2 — Grand Prix Pro (Monza)</option>
          <option value="2">Niv. 3 — Circuit Urbain Nocturne (Monaco)</option>
          <option value="3">Niv. 4 — Circuit Double-Boucle (Figure 8)</option>
        </select>
      </div>

      <!-- Poids Suivi de Trajectoire -->
      <div class="control-group">
        <label for="slider-follow">Trajectoire :</label>
        <input id="slider-follow" type="range" min="0" max="6" step="0.1" value="2.2" />
        <output id="val-follow">2.2</output>
      </div>

      <!-- Poids Séparation / Distance de Sécurité -->
      <div class="control-group">
        <label for="slider-separate">Séparation :</label>
        <input id="slider-separate" type="range" min="0" max="8" step="0.1" value="2.8" />
        <output id="val-separate">2.8</output>
      </div>

      <!-- Vitesse des Motos -->
      <div class="control-group">
        <label for="slider-speed">Vitesse :</label>
        <input id="slider-speed" type="range" min="1" max="10" step="0.5" value="4.2" />
        <output id="val-speed">4.2</output>
      </div>

      <div class="control-group">
        <label for="slider-detection">Détection :</label>
        <input id="slider-detection" type="range" min="40" max="400" step="10" value="170" />
        <output id="val-detection">170px</output>
      </div>
      <div class="control-group">
        <label for="slider-volume">Volume :</label>
        <input id="slider-volume" type="range" min="0" max="1" step="0.05" value="0.45" />
        <output id="val-volume">45%</output>
      </div>
      <div class="control-group">
        <label for="select-racer">Réglages moto :</label>
        <select id="select-racer"></select>
        <select id="select-driving-style" aria-label="Style de conduite">
          <option value="prudent">Prudent</option><option value="normal" selected>Normal</option><option value="aggressive">Agressif</option>
        </select>
      </div>
      <div class="control-group">
        <label for="slider-racer-speed">Vmax moto :</label>
        <input id="slider-racer-speed" type="range" min="1" max="10" step="0.5" value="4.2" />
        <output id="val-racer-speed">4.2</output>
      </div>
      <div class="control-group">
        <label for="slider-force">Accélération :</label>
        <input id="slider-force" type="range" min="0.1" max="1.5" step="0.05" value="0.45" />
        <output id="val-force">0.45</output>
      </div>
      <div class="control-group">
        <label for="slider-precision">Précision :</label>
        <input id="slider-precision" type="range" min="0.25" max="2" step="0.05" value="1" />
        <output id="val-precision">1.00</output>
      </div>


      <!-- Actions Rapides -->
      <div class="control-group">
        <button id="btn-add-obstacle">+ Obstacle [O]</button>
        <button id="btn-remove-obstacle">Supprimer obstacle [X]</button>
        <button id="btn-pause">Pause [P]</button>
        <button id="btn-reset">Réinitialiser [R]</button>
        <button id="btn-add-moto" class="primary" title="Touche ' (apostrophe)">+ Moto [ ' ]</button>
        <button id="btn-add-squad" title="Touche S">+ Écurie [S]</button>
        <button id="btn-klaxon" class="horn-btn" title="Touche K ou H">📢 Klaxon [K]</button>
        <button id="btn-nitro" class="nitro-btn" title="Touche Espace / B">⚡ Nitro</button>
        <button id="btn-audio" title="Touche M">🔊 Son : ON</button>
        <button id="btn-next-level" title="Touche N">Niv. Suivant [N]</button>
        <button id="btn-debug" title="Touche D">Debug [D] : OFF</button>
        <button id="btn-clear">Effacer</button>
      </div>
    </header>

    <div class="hud-info">
      🏍️ <b>Touche ' (apostrophe)</b> : Créer une moto GP | <b>Touche S</b> : Créer une écurie en aspiration<br/>
      📢 <b>Touche K / H</b> : Klaxonner | ⚡ <b>Espace / B</b> : Nitro Boost | <b>Touche N</b> : Circuit suivant | <b>Touche M</b> : Couper son
    </div>
  </body>
</html>
